[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-search-lab"
version = "0.1.0"
description = "A dependency-free fuzzy-search index with threshold-aware edit distance, length bucketing, and Unicode normalization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["fuzzy-search", "levenshtein", "unicode", "text-search", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/linluozi/fuzzy-search-lab"
Source = "https://github.com/linluozi/fuzzy-search-lab"
Issues = "https://github.com/linluozi/fuzzy-search-lab/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
